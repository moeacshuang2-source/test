<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工程施工查核紀錄資料庫 v1</title>
<style>
:root{--bg:#f3f5f9;--c:#fff;--t:#1b2434;--m:#6b7689;--p:#2f6fed;--pl:#e8f0ff;--b:#e3e8f0;--w:#d64545;--wb:#fdecec;--ok:#1f9d6b;--th:#f6f8fb;--in:#fff;--tg:#e6f5ee;--tgt:#1d7a55;--mk:#ffe58a;--am:#fff6e0;--amt:#8a5a00;--sh:0 1px 3px #1b24341a,0 6px 18px #1b24340a}
@media(prefers-color-scheme:dark){:root{--bg:#12161d;--c:#1a2029;--t:#e6eaf2;--m:#93a0b5;--p:#6b9bff;--pl:#22304d;--b:#2a3342;--w:#ff7b7b;--wb:#3a2024;--ok:#4cd0a0;--th:#202836;--in:#141a22;--tg:#1d3a30;--tgt:#7fe0b8;--mk:#6b5a10;--am:#3a3016;--amt:#f0c866;--sh:none}}
*{box-sizing:border-box}body{margin:0;font:15px/1.65 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--t)}
#app{display:flex;min-height:100vh}
#nav{width:216px;flex:none;background:var(--c);border-right:1px solid var(--b);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:16px;padding:6px 10px 14px}.brand small{display:block;font-weight:400;color:var(--m);font-size:12px}
#nav button{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--t);padding:9px 12px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
#nav button:hover{background:var(--pl)}#nav button.on{background:var(--pl);color:var(--p);font-weight:700}
main{flex:1;min-width:0;max-width:1120px;padding:22px 28px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{margin:0;font-size:22px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
h2{margin:.1em 0 .7em;font-size:16px}h3{font-size:14px;margin:1em 0 .3em;color:var(--m)}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--b);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--th);color:var(--m);font-size:13px;font-weight:600;white-space:nowrap}tr.cl:hover{background:var(--pl);cursor:pointer}
input,select,textarea{font:inherit;padding:6px 10px;border:1px solid var(--b);border-radius:8px;background:var(--in);color:var(--t)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);outline-offset:-1px}textarea{width:100%}
button.b{background:var(--p);color:#fff;border:0;border-radius:8px;padding:7px 16px;cursor:pointer;font:inherit}
button.g{background:transparent;color:var(--p);border:1px solid var(--b);border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit}button.g:hover{background:var(--pl)}
button.d{background:var(--w);color:#fff;border:0;border-radius:8px;padding:7px 16px;cursor:pointer;font:inherit}button.sm{padding:2px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.chk{display:flex;gap:6px;align-items:center;font-size:14px}
.stat{display:flex;gap:12px;flex-wrap:wrap}.stat div{flex:1;min-width:130px;background:var(--pl);border-radius:10px;padding:12px;text-align:center;color:var(--m);font-size:13px}
.stat b{display:block;font-size:24px;color:var(--p)}
.tg{display:inline-block;background:var(--tg);color:var(--tgt);border-radius:10px;padding:0 9px;font-size:12px;margin:3px 4px 0 0}
.pill{display:inline-block;background:var(--pl);color:var(--p);border-radius:10px;padding:0 9px;font-size:12px}.pill.w{background:var(--wb);color:var(--w)}
.bd{color:var(--m);font-size:13px}.warn{background:var(--wb);color:var(--w);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.note{background:var(--am);color:var(--amt);padding:10px 14px;border-radius:10px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--m);padding:40px 0}.miss{border-color:var(--w)!important;background:var(--wb)}.lab{font-size:13px;color:var(--m);margin-top:8px}
.bar{background:var(--p);opacity:.55;height:12px;border-radius:6px}.mut{color:var(--m);font-size:13px}
#modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;overflow:auto;padding:24px}
#modal>div{background:var(--c);max-width:1000px;margin:0 auto;border-radius:14px;padding:20px}
.it{display:flex;gap:8px;border-bottom:1px solid var(--b);padding:10px 0}.it:last-child{border:0}.it input,.it select{font-size:13px;margin:4px 4px 0 0}
.star{background:none;border:0;font-size:20px;color:var(--b);cursor:pointer;padding:0 4px;align-self:flex-start}.star.on{color:#e6a700}
mark{background:var(--mk);color:inherit;border-radius:3px}.kv td:first-child{width:170px;color:var(--m);white-space:nowrap}a{color:var(--p)}
@media(max-width:820px){#app{display:block}#nav{width:auto;height:auto;flex-direction:row;flex-wrap:wrap;z-index:5}.brand{display:none}main{padding:14px}}
@media print{#nav,.noprint{display:none}#modal{position:static;background:none}}
#dlg{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:center;justify-content:center}#dlg>div{background:var(--c);border-radius:14px;padding:20px;width:340px;max-width:92vw}
details summary{list-style:revert}svg text{font-size:11px}
.dz{display:block;border:2px dashed var(--b);border-radius:14px;padding:56px 20px;text-align:center;cursor:pointer;background:var(--pl)}.dz:hover,.dz.on{border-color:var(--p)}
.cb{position:relative;display:inline-block}.cl2{display:none;position:absolute;top:100%;left:0;min-width:100%;max-height:260px;overflow:auto;background:var(--c);border:1px solid var(--b);border-radius:8px;box-shadow:0 6px 18px #0003;z-index:12;margin-top:2px}.cl2 div{padding:7px 12px;cursor:pointer;white-space:nowrap}.cl2 div:hover{background:var(--pl)}
</style></head><body>
<div id="app"><aside id="nav"></aside><main id="main"></main></div><div id="modal"></div><div id="dlg"></div>
<script>
/* ========== 工具 ========== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* ========== 資料層：IndexedDB ========== */
let db,R=[];
const DEFRULES=`監造類:監造計畫,監造報表,監造單位,抽查
施工品質類:石籠,混凝土,鋼筋,填石,頂網,平整度,抿石子
品管類:品質計畫,自主檢查,品管人員,內部稽核,品質稽核,檢(試)驗,試驗
職安衛類:安全插銷,防護,護欄,告示牌,鐵絲,高差,安全
環保文明類:積水,堆置,泥濘,排水不良,污染
進度款項類:進度,付款,經費
防汛應變類:防汛,導流,過水便橋,預警
文件管理類:誤植,記載,登載,編號,日期,不一致`;
let META={k:'cfg',catalog:{},rules:DEFRULES,lastBackup:0,changes:0};
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('inspectDB',1);r.onupgradeneeded=()=>{r.result.createObjectStore('records',{keyPath:'id'});r.result.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k));
async function saveRec(r){try{await put('records',r);META.changes++;await put('meta',META)}catch(e){alert('寫入失敗：'+e.message)}}
const saveMeta=()=>put('meta',META).catch(e=>alert('寫入失敗：'+e.message));
/* ========== 解析器 ========== */
const LABELS=[['plan','列管計畫名稱'],['host','計畫主辦機關'],['sup','標案所屬工程主管機關'],['dateR','查核日期'],['name','標案名稱'],['place','地點'],['exec','標案執行機關'],['pm','專案管理單位'],['design','設計單位'],['super','監造單位'],['contractor','承攬商'],['budget','發包預算'],['contract','契約金額'],['summary','工程概要'],['prog','工程進度、經費支用及目前施工概要'],['comm','查核委員'],['period','開工及預定完工日期'],['lead','領隊及工作人員'],['scoreS','查核分數'],['pros','優點'],['cons','缺點'],['design2','規劃設計問題及建議'],['other','其他建議'],['ded','扣點統計'],['insp','檢驗拆驗']];
const trim=s=>s.replace(/^[\s|：:]+|[\s|]+$/g,'');
function parse(txt){
  txt=txt.replace(/\r/g,'').replace(/\t/g,' | ');const F={},found=[];let pos=0;
  for(const[k,l]of LABELS){const re=new RegExp(k==='contractor'?'承\\s*[攬包]\\s*商':l.split('').map(rx).join('\\s*'));const m=re.exec(txt.slice(pos));if(m){found.push([k,pos+m.index,m[0].length]);pos+=m.index+m[0].length}else F[k]=''}
  found.forEach((f,i)=>{F[f[0]]=trim(txt.slice(f[1]+f[2],i+1<found.length?found[i+1][1]:txt.length))});
  F.scoreS=(F.scoreS||'').replace(/^[（(]\s*等級\s*[）)][\s|]*/,'');
  ['plan','host','sup','dateR','name','place','exec','pm','design','super','contractor','budget','contract'].forEach(k=>F[k]=(F[k]||'').replace(/\s*\n\s*/g,''));
  return F}
const toISO=s=>{const m=(s||'').match(/(\d{2,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);return m?`${+m[1]+1911}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''};
function cmt(s){const o=[];const sp=t=>(t||'').split(/[、,，\s]+/).filter(Boolean);
  const a=(s||'').match(/外聘[：:]\s*([\s\S]*?)(?=內聘|$)/),b=(s||'').match(/內聘[：:]\s*([\s\S]*?)(?=外聘|$)/);
  sp(a&&a[1]).forEach(n=>o.push({n,t:'外聘'}));sp(b&&b[1]).forEach(n=>o.push({n,t:'內聘'}));return o}
const strip=s=>s.replace(/^\s*\d{1,2}[.、]\s*(?!\d)/,'').trim();
const splitList=t=>(t||'').split(/\n+|(?<=。)\s+/).map(strip).filter(x=>x&&!/^無[。.]?$/.test(x));
function splitDefects(t){const out=[],re=/([\s\S]*?)【([^】]+)】\s*[（(]\s*([\d.]+)\s*[）)]/g;let m;
  while(m=re.exec(t||'')){let x=strip(trim(m[1]).replace(/\n+/g,''));const dm=x.match(/[（(]\s*扣\s*(\d+(?:\.\d+)?)\s*點\s*[）)]\s*$/);if(dm)x=x.slice(0,dm.index).trim();if(x)out.push({text:x,lv:m[2],code:m[3],dp:dm?+dm[1]:0})}return out}
function classify(text,type){const c=[];META.rules.split('\n').forEach(l=>{const[n,k]=l.split(':');if(n&&k&&k.split(',').some(w=>w&&text.includes(w.trim())))c.push(n.trim())});if(type==='規劃設計建議')c.push('設計類');return c}
function buildItems(F){const it=[];const add=(type,arr)=>arr.forEach((a,i)=>{const o=typeof a==='string'?{text:a}:a;it.push({type,seq:i+1,text:o.text,lv:o.lv||'',code:o.code||'',dp:o.dp||0,cats:classify(o.text,type),fav:false,tags:[],note:'',by:''})});
  add('優點',splitList(F.pros));add('缺點',splitDefects(F.cons));add('規劃設計建議',splitList(F.design2));add('其他建議',splitList(F.other));return it}
function mk(F,raw,id){const sc=(F.scoreS||'').match(/(\d+(?:\.\d+)?)\s*[（(]\s*([^）)]+)/);
  return{id:id||'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),F,iso:toISO(F.dateR),score:sc?+sc[1]:null,grade:sc?sc[2].trim():'',committee:cmt(F.comm),items:buildItems(F),raw,created:Date.now()}}
/* ========== 檔案讀取 (odt/docx 為 zip) ========== */
async function unzip(buf,name){const v=new DataView(buf),u=new Uint8Array(buf);let e=u.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);
  for(let i=0;i<n;i++){const meth=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),fl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true),fn=new TextDecoder().decode(u.slice(p+46,p+46+fl));
    if(fn===name){const s=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true),data=u.slice(s,s+cs);if(meth===0)return new TextDecoder().decode(data);
      const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(data);w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())}
    p+=46+fl+xl+cl}throw Error('壓縮檔內找不到 '+name)}
function xmlText(xml,k){const d=new DOMParser().parseFromString(xml,'application/xml');const T=k==='odt'?['table:table-row','table:table-cell','text:p']:['w:tr','w:tc','w:p'];
  const rows=[...d.getElementsByTagName(T[0])];if(!rows.length)return[...d.getElementsByTagName(T[2])].map(p=>p.textContent).join('\n');
  return rows.map(r=>'| '+[...r.children].filter(c=>/cell|:tc$/.test(c.nodeName)).map(c=>[...c.getElementsByTagName(T[2])].map(p=>p.textContent).join('\n')).join(' | ')+' |').join('\n')}
async function readFile(f){const x=f.name.split('.').pop().toLowerCase();
  if(x==='odt')return xmlText(await unzip(await f.arrayBuffer(),'content.xml'),'odt');
  if(x==='docx')return xmlText(await unzip(await f.arrayBuffer(),'word/document.xml'),'docx');
  const t=await f.text();return x==='html'||x==='htm'?t.replace(/<(br|\/p|\/tr)>/gi,'\n').replace(/<\/t[dh]>/gi,' | ').replace(/<[^>]+>/g,''):t}
/* ========== 狀態與導覽 ========== */
let view='home',PV=null,SPRE=null,LAST=[],sortK='iso',sortD=-1,SS={};
const NAV=[['home','總覽'],['list','紀錄'],['import','匯入'],['search','搜尋'],['codes','缺失編號'],['cmt','委員分析'],['fav','常用缺失庫'],['set','設定/備份']];
const go=(v,a)=>{SPRE=a||null;view=v;closeM();render()};
const allItems=()=>R.flatMap(r=>r.items.map((it,i)=>({...it,r,i})));
function codeStats(){const M={};allItems().filter(x=>x.code).forEach(x=>{const o=M[x.code]??={code:x.code,n:0,recs:new Set,last:'',sample:x.text};o.n++;o.recs.add(x.r.id);if(x.r.iso>=o.last){o.last=x.r.iso;o.sample=x.text}});return Object.values(M).sort((a,b)=>b.n-a.n)}
function banner(){const d=(Date.now()-META.lastBackup)/864e5;let m='';
  if(R.length&&(META.changes>=5||d>7))m=`<div class="warn noprint">⚠ 距上次備份已有 ${META.changes} 筆異動／${META.lastBackup?Math.floor(d)+' 天':'從未備份'}，請到「設定/備份」匯出 JSON。</div>`;return m}
function render(){const ic={home:'📊',list:'🗂️',import:'📥',search:'🔍',codes:'🔢',cmt:'👤',fav:'⭐',set:'⚙️'};
  $('#nav').innerHTML=`<div class="brand">🏗️ 查核紀錄資料庫<small>${R.length} 筆紀錄</small></div>`+NAV.map(([k,n])=>`<button class="${k===view?'on':''}" onclick="go('${k}')"><span>${ic[k]}</span>${n}</button>`).join('');
  $('#main').innerHTML=`<div class="top"><h1>${NAV.find(n=>n[0]===view)[1]}</h1></div>`+banner()+({home:vHome,list:vList,import:vImport,search:vSearch,codes:vCodes,cmt:vCmt,fav:vFav,set:vSet}[view])();
  if(view==='search')runSearch();if(view==='import'&&PV)drawPV();if(view==='codes'&&CSEL){const e=$('#csel');if(e)e.scrollIntoView({block:'start'})}}
/* ========== 總覽 ========== */
function topN(arr,n){const m={};arr.forEach(x=>m[x]=(m[x]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n)}
function bars(a,fn){const mx=a.length?a[0][1]:1;return a.map(([k,v])=>`<tr${fn?` class="cl" onclick="${fn}(decodeURIComponent('${encodeURIComponent(k)}'))"`:''}><td>${esc(k)}</td><td style="width:50%"><div class="bar" style="width:${v/mx*100}%"></div></td><td>${v}</td></tr>`).join('')}
const sCode=c=>go('search',{code:c}),sCat=c=>go('search',{sk:c});
function todoCard(){const T=[],per=f=>R.map(r=>[r,r.items.filter(f).length]).filter(a=>a[1]);
  const pend=R.filter(r=>r.score==null);if(pend.length)T.push({t:'尚未填分數',n:pend.length,u:'筆',L:pend.map(r=>[r.id,r.F.name]),b:['前往補填',"LF.p=true;go('list')"]});
  const bad=R.filter(r=>!r.iso||!r.committee.length||!r.items.some(x=>x.type==='缺點'));if(bad.length)T.push({t:'資料可能不完整（缺日期／委員／缺點）',n:bad.length,u:'筆',L:bad.map(r=>[r.id,r.F.name])});
  return`<div class="card"><h2>待辦提醒</h2>`+(T.length?T.map(t=>`<details style="border-bottom:1px solid var(--b);padding:6px 0"><summary style="cursor:pointer"><b>${t.t}</b> <span class="pill w">${t.n} ${t.u}</span>${t.b?` <button class="g sm" onclick="event.preventDefault();event.stopPropagation();${t.b[1]}">${t.b[0]}</button>`:''}</summary><div style="padding:6px 0 0 14px">${t.L.slice(0,15).map(([id,l])=>`<div><a href="#" onclick="detail('${id}');return false">${esc(l)}</a></div>`).join('')||'<span class="mut">請至該頁處理</span>'}${t.L.length>15?`<div class="mut">…另有 ${t.L.length-15} 筆</div>`:''}</div></details>`).join(''):'<div style="color:var(--ok)">✅ 目前沒有待辦事項</div>')+'</div>'}
function lineSVG(P){if(P.length<2)return'<div class="mut">至少需要 2 筆已有分數的紀錄</div>';const W=560,H=190,p=34,ys=P.map(a=>a.y),lo=Math.max(0,Math.min(...ys)-5),hi=Math.min(100,Math.max(...ys)+5),X=i=>p+i*(W-2*p)/(P.length-1),Y=v=>H-p-(v-lo)/((hi-lo)||1)*(H-2*p);
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" style="stroke:var(--b)"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" style="stroke:var(--b)"/>
  <text x="${p-6}" y="${Y(hi)+4}" text-anchor="end" style="fill:var(--m)">${hi}</text><text x="${p-6}" y="${Y(lo)+4}" text-anchor="end" style="fill:var(--m)">${lo}</text>
  <text x="${p}" y="${H-10}" style="fill:var(--m)">${P[0].l}</text><text x="${W-p}" y="${H-10}" text-anchor="end" style="fill:var(--m)">${P[P.length-1].l}</text>

function yearTable(){const Y={};R.forEach(r=>{if(!r.iso)return;const y=+r.iso.slice(0,4)-1911,o=Y[y]??={n:0,s:[],d:0};o.n++;if(r.score!=null)o.s.push(r.score);o.d+=r.items.filter(x=>x.type==='缺點').length});

  if(!q&&!ty&&!cat&&!cm&&!d1&&!d2){LAST=[];$('#sres').innerHTML='<div class="empty">請輸入關鍵字或缺失編號，或選擇篩選條件（含委員、查核日期）後開始搜尋</div>';return}
  const inDate=r=>(!d1||(r.iso&&r.iso>=d1))&&(!d2||(r.iso&&r.iso<=d2));
  if((cm||d1||d2)&&!q&&!ty&&!cat){LAST=[];const rs=R.filter(r=>inDate(r)&&(!cm||r.committee.some(c=>c.n.includes(cm)))).sort((a,b)=>b.iso>a.iso?1:-1);
    $('#sres').innerHTML=`<div class="mut" style="margin-bottom:8px">${[cm,d1||d2?(d1||'')+' ～ '+(d2||''):''].filter(Boolean).map(esc).join('｜')} 共 ${rs.length} 件查核（點選可檢視完整紀錄；要看內容請再加關鍵字或編號）</div><div class="card" style="padding:4px 18px">`+(rs.map(r=>`<div class="it" style="cursor:pointer" onclick="detail('${r.id}')"><div style="flex:1"><b>${esc(r.F.name)}</b><div class="bd">${esc(r.F.dateR)} ｜ ${esc(r.F.exec)} ｜ ${r.score!=null?r.score+(r.grade?'('+esc(r.grade)+')':''):'待補分數'}</div></div></div>`).join('')||'<div class="empty">沒有符合的查核</div>')+'</div>';return}
  const terms=q.split(/\s+/).filter(Boolean);
  LAST=allItems().filter(x=>{if(!inDate(x.r))return false;if(ty&&x.type!==ty)return false;if(cat&&!x.cats.includes(cat))return false;if(cm&&!x.r.committee.some(c=>c.n.includes(cm)))return false;
    const hay=x.text+' '+x.note+' '+x.tags.join(' ')+' '+(x.code||'');return terms.every(t=>t[0]==='-'&&t.length>1?!t.slice(1).split('|').some(o=>hit(x,hay,o)):t.split('|').some(o=>hit(x,hay,o)))}).sort((a,b)=>b.r.iso>a.r.iso?1:-1);
  const hs=terms.filter(t=>t[0]!=='-').flatMap(t=>t.split('|')).filter(o=>!isCodeDot(o));
  $('#sres').innerHTML=`<div class="mut" style="margin-bottom:8px">共 ${LAST.length} 條結果${LAST.length>200?'（僅顯示前 200 條）':''}</div><div class="card" style="padding:4px 18px">`+(LAST.slice(0,200).map(x=>`<div class="it"><button class="star ${x.fav?'on':''}" title="標記常用" onclick="favQuick('${x.r.id}',${x.i},this)">★</button><div style="flex:1"><div class="bd"><span class="pill">${esc(x.type)}</span>${x.lv?' 【'+esc(x.lv)+'】':''}${x.code?' ('+x.code+')':''}${x.dp?' <span class="pill w">扣'+x.dp+'點</span>':''} ｜ <a href="#" onclick="detail('${x.r.id}');return false">${esc(x.r.F.name)}</a> ${esc(x.r.F.dateR)}</div>${hl(x.text,hs)}</div>${cpBtn(x)}</div>`).join('')||'<div class="empty">沒有符合的結果</div>')+'</div>'}
const fmt=x=>x.text+(x.dp?`(扣${x.dp}點)`:'')+(x.code?`【${x.lv}】(${x.code})`:'');
function cp(el,enc){const t=decodeURIComponent(enc),ok=()=>{const o=el.textContent;el.textContent='已複製 ✓';setTimeout(()=>el.textContent=o,1200)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){alert('複製失敗')}a.remove()};
  navigator.clipboard?navigator.clipboard.writeText(t).then(ok,fb):fb()}
const cpBtn=x=>`<button class="g sm" style="align-self:flex-start;white-space:nowrap" onclick="cp(this,'${encodeURIComponent(fmt(x))}')">複製</button>`;
function copyAll(){navigator.clipboard.writeText(LAST.map(fmt).join('\n')).then(()=>alert('已複製 '+LAST.length+' 條'))}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
const csvQ=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
function csvSearch(){dl('查核搜尋結果.csv','\ufeff'+['標案名稱,查核日期,承攬商,類型,缺失編號,程度,分類,內文,備註',...LAST.map(x=>[x.r.F.name,x.r.F.dateR,x.r.F.contractor,x.type,x.code,x.lv,x.cats.join('/'),x.text,x.note].map(csvQ).join(','))].join('\n'),'text/csv')}
/* ========== 缺失編號 ========== */
let CQ='';
let CSK='n',CSD=-1,CSEL='';
const sortCodes=k=>{CSD=CSK===k?-CSD:(k==='code'?1:-1);CSK=k;codesUpd()};
function toggleCode(c){CSEL=CSEL===c?'':c;codesUpd();const e=$('#csel');if(e)e.scrollIntoView({block:'nearest'})}
const codeHist=c=>allItems().filter(x=>x.code===c&&x.type==='缺點').sort((a,b)=>b.r.iso>a.r.iso?1:-1).map(x=>`<div class="it"><div style="flex:1"><div class="bd"><a href="#" onclick="detail('${x.r.id}');return false">${esc(x.r.F.name)}</a> ${esc(x.r.F.dateR)}${x.lv?' 【'+esc(x.lv)+'】':''}</div>${esc(x.text)}</div>${cpBtn(x)}</div>`).join('');
function codesTab(){const cs=codeStats().filter(c=>!CQ||c.code.startsWith(CQ));
  const cmp={code:(a,b)=>a.code.localeCompare(b.code,'en',{numeric:true}),n:(a,b)=>a.n-b.n,last:(a,b)=>a.last>b.last?1:a.last<b.last?-1:0};
  cs.sort((a,b)=>cmp[CSK](a,b)*CSD||a.code.localeCompare(b.code,'en',{numeric:true}));
  const th=(k,n)=>`<th style="cursor:pointer" onclick="sortCodes('${k}')">${n}${CSK===k?(CSD>0?' ▲':' ▼'):''}</th>`;
  return`<div class="mut" style="margin-bottom:6px">${cs.length} 個編號（點標題可排序；「查看」就地展開歷史原文，離開再回來會保留位置）</div><table><tr>${th('code','編號')}${th('n','次數')}${th('last','最近')}<th>代表內文</th><th></th></tr>${cs.map(c=>`<tr><td><b>${c.code}</b></td><td>${c.n}</td><td>${c.last}</td><td>${esc(c.sample.slice(0,60))}…</td>
  <td><button class="g sm" onclick="toggleCode('${c.code}')">${CSEL===c.code?'收合':'查看'}</button></td></tr>${CSEL===c.code?`<tr id="csel"><td colspan="5" style="background:var(--th)"><b>${c.code} 歷史紀錄（${c.n} 次）</b>${codeHist(c.code)}</td></tr>`:''}`).join('')}</table>`}
const codesUpd=()=>{$('#ctab').innerHTML=codesTab()};
function vCodes(){const D=allItems().filter(x=>x.type==='缺點'),A=codeStats(),pre=topN(D.filter(x=>x.code).map(x=>x.code.split('.').slice(0,2).join('.')),8);
  return`<div class="card"><div class="stat"><div><b>${D.length}</b>缺點總數</div><div><b>${A.length}</b>不同缺失編號</div><div><b>${A[0]?A[0].code:'-'}</b>最常出現（${A[0]?A[0].n:0} 次）</div><div><b>${R.length?(D.length/R.length).toFixed(1):'-'}</b>平均每份缺點數</div></div></div>
  <div class="card"><h2>編號前綴分布</h2><table>${bars(pre)||'<tr><td>尚無資料</td></tr>'}</table></div>
  <div class="card"><div class="row"><input placeholder="編號前綴 如 4.02" value="${esc(CQ)}" oninput="CQ=this.value;codesUpd()"></div><div id="ctab">${codesTab()}</div></div>`}
function nameCode(c){const m=META.catalog[c]??={};const n=prompt('「'+c+'」標準名稱：',m.name||'');if(n!==null){m.name=n;saveMeta();render()}}
function favCode(c){const m=META.catalog[c]??={};m.fav=!m.fav;saveMeta();render()}
/* ========== 委員分析 ========== */
let CM='';
let CMQ='';
const cmtMap=()=>{const M={};R.forEach(r=>r.committee.forEach(c=>(M[c.n]??=[]).push(r)));return M};
function cmtTable(){const M=cmtMap(),mine=n=>M[n].flatMap(r=>r.items.filter(x=>x.by===n));
  const ns=Object.keys(M).filter(n=>!CMQ||n.includes(CMQ)).sort((a,b)=>mine(b).length-mine(a).length||M[b].length-M[a].length);
  return`<div class="mut" style="margin-bottom:6px">${ns.length} 位委員（點選查看）</div><table><tr><th>姓名</th><th>參與次數</th><th>平均分數</th><th>已標示項目數</th></tr>${ns.map(n=>{const s=M[n].filter(r=>r.score!=null);return`<tr class="cl" onclick="CM='${esc(n)}';render()"><td>${esc(n)}</td><td>${M[n].length}</td><td>${s.length?(s.reduce((a,r)=>a+r.score,0)/s.length).toFixed(1):'-'}</td><td>${mine(n).length}</td></tr>`}).join('')||'<tr><td colspan="4" class="mut">沒有符合的委員</td></tr>'}</table>`}
const cmtUpd=()=>{$('#cmtab').innerHTML=cmtTable()};
function vCmt(){const M=cmtMap(),mine=n=>M[n].flatMap(r=>r.items.map(x=>({...x,r})).filter(x=>x.by===n));
  let h=`<div class="card"><h2>查核委員</h2><p class="mut">只統計你在單筆紀錄中手動標示「提出委員」的項目。</p><div class="row"><input placeholder="輸入姓名或姓氏搜尋" value="${esc(CMQ)}" oninput="CMQ=this.value;cmtUpd()" size="26"></div><div id="cmtab">${cmtTable()}</div></div>`;
  if(CM&&M[CM]){const its=mine(CM),un=M[CM].flatMap(r=>r.items).filter(x=>x.type==='缺點'&&!x.by).length;
    h+=`<div class="card"><h2>${esc(CM)} 提出的項目（${its.length}）</h2>${un?`<div class="note">尚有 ${un} 條缺點未標示提出委員，請到單筆紀錄頁指定。</div>`:''}
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="flex:1"><h3>常見缺失編號</h3><table>${bars(topN(its.map(x=>x.code).filter(Boolean),10))||'<tr><td class="mut">無</td></tr>'}</table></div><div style="flex:1"><h3>常見分類</h3><table>${bars(topN(its.flatMap(x=>x.cats),10))||'<tr><td class="mut">無</td></tr>'}</table></div></div>
    <h3>項目清單</h3>${its.map(x=>`<div class="it"><div style="flex:1"><div class="bd"><span class="pill">${esc(x.type)}</span>${x.code?' ('+x.code+')':''}${x.dp?' <span class="pill w">扣'+x.dp+'點</span>':''} ｜ <a href="#" onclick="detail('${x.r.id}');return false">${esc(x.r.F.name)}</a> ${esc(x.r.F.dateR)}</div>${esc(x.text)}</div>${cpBtn(x)}</div>`).join('')||'<div class="mut">尚未標示</div>'}</div>`}
  return h}
/* ========== 常用缺失庫 ========== */
function vFav(){const L=allItems().filter(x=>x.fav),cn={};codeStats().forEach(c=>cn[c.code]=c.n);
  const row=x=>`<div class="it"><button class="star on" title="取消常用" onclick="favQuick('${x.r.id}',${x.i})">★</button><div style="flex:1"><div class="bd">${x.code?'('+x.code+') 歷史出現 '+cn[x.code]+' 次 ｜ ':''}${esc(x.r.F.name)} ${esc(x.r.F.dateR)}</div>${esc(x.text)}</div>${cpBtn(x)}</div>`;
  return`<div class="card"><h2>常用項目（${L.length}）</h2><p class="mut">在單筆紀錄或搜尋結果中點 ★ 的項目會依類型集中在這裡，可一鍵複製（含扣點與【程度】(編號)）。</p></div>`+['優點','缺點','其他建議','規劃設計建議'].map(t=>{const G=L.filter(x=>x.type===t);return`<div class="card"><h2>${t}（${G.length}）</h2>${G.map(row).join('')||'<div class="mut">尚無</div>'}</div>`}).join('')}
async function favQuick(id,i,el){const r=R.find(x=>x.id===id);r.items[i].fav=!r.items[i].fav;await saveRec(r);if(el)el.classList.toggle('on',r.items[i].fav);else render()}
const gradeOf=n=>n===''||n==null?'':n>=90?'優等':n>=80?'甲等':n>=70?'乙等':'丙等';
function editScore(id){const r=R.find(x=>x.id===id),set=new Set();for(let n=100;n>=0;n--)set.add(n);if(r.score!=null)set.add(r.score);
  const so='<option value="">尚未公布</option>'+[...set].sort((a,b)=>b-a).map(n=>`<option value="${n}" ${n===r.score?'selected':''}>${n}</option>`).join('');
  $('#dlg').innerHTML=`<div><h2>修改查核分數</h2><div class="mut">${esc(r.F.name)}</div><div class="lab">分數</div><select id="ds" style="width:100%" onchange="$('#dgv').textContent=gradeOf(this.value===''?'':+this.value)||'—'">${so}</select>
  <div class="lab">等級（依分數自動判定）</div><div><span class="pill" id="dgv" style="font-size:15px;padding:2px 14px">${gradeOf(r.score)||'—'}</span></div><div class="mut" style="margin-top:8px">優等≧90｜甲等 80～<90｜乙等 70～<80｜丙等<70</div>
  <div class="row" style="margin:14px 0 0;justify-content:flex-end"><button class="g" onclick="$('#dlg').style.display='none'">取消</button><button class="b" onclick="saveScore('${id}')">儲存</button></div></div>`;$('#dlg').style.display='flex'}
async function saveScore(id){const r=R.find(x=>x.id===id),v=$('#ds').value;
  if(v===''){r.score=null;r.grade='';r.F.scoreS=''}else{r.score=+v;r.grade=gradeOf(+v);r.F.scoreS=v+'('+r.grade+')'}
  $('#dlg').style.display='none';await saveRec(r);render();if($('#modal').style.display==='block')detail(id)}
/* ========== 手動編輯紀錄 */
function editRec(id){const r=R.find(x=>x.id===id),F=r.F,lst=t=>r.items.filter(x=>x.type===t).map(x=>x.text).join('\n');
  const V={...F,pros:lst('優點'),design2:lst('規劃設計建議'),other:lst('其他建議'),cons:(F.cons||'').replace(/(【[^】]+】\s*[（(]\s*[\d.]+\s*[）)])[ \t]*/g,'$1\n').trim()};
  const big={summary:5,prog:5,pros:4,cons:10,design2:4,other:6,ded:3,insp:3};
  $('#modal').innerHTML=`<div><div class="row"><h2 style="flex:1">編輯紀錄</h2><button class="b" onclick="saveEdit('${id}')">儲存</button><button class="g" onclick="reparse('${id}')" title="用目前的解析規則重新讀取原始全文並填入欄位（按儲存才會生效）">用原文重新解析</button><button class="g" onclick="detail('${id}')">取消</button></div>
  <div class="mut">缺點請維持「內文(扣X點)【程度】(編號)」格式，每條一行；優點與各項建議每條一行。已標示的★、標籤、備註、提出委員會依內文保留。</div>`+LABELS.map(([k,n])=>`<div class="lab">${n}</div><textarea id="e_${k}" rows="${big[k]||1}">${esc(V[k])}</textarea>`).join('')+'</div>';$('#modal').style.display='block'}
function reparse(id){const r=R.find(x=>x.id===id);if(!r.raw)return alert('此紀錄沒有保存原文');if(!confirm('將以原始全文重新解析並覆蓋目前表單內容（尚未儲存的修改會消失），繼續？'))return;
  const P=parse(r.raw);P.cons=(P.cons||'').replace(/(【[^】]+】\s*[（(]\s*[\d.]+\s*[）)])[ \t]*/g,'$1\n').trim();LABELS.forEach(([k])=>{const e=$('#e_'+k);if(e)e.value=P[k]||''})}
async function saveEdit(id){const old=R.find(x=>x.id===id),F={};LABELS.forEach(([k])=>F[k]=$('#e_'+k).value.trim());
  ['plan','host','sup','dateR','name','place','exec','pm','design','super','contractor','budget','contract'].forEach(k=>F[k]=F[k].replace(/\s*\n\s*/g,''));
  const n=mk(F,old.raw,id);if(!F.name||!n.iso)return alert('標案名稱與查核日期必須有效（例：115年09月03日）');
  n.created=old.created;n.items.forEach(it=>{const o=old.items.find(x=>x.type===it.type&&x.text===it.text&&x.code===it.code);if(o){it.fav=o.fav;it.tags=o.tags;it.note=o.note;it.by=o.by}});
  R=R.map(x=>x.id===id?n:x);await saveRec(n);render();detail(id)}
/* ========== 設定/備份 ========== */
function vSet(){return`<div class="card"><h2>備份與還原</h2><p class="mut">資料存於本瀏覽器 IndexedDB，清除瀏覽器資料會消失，請定期匯出並存放到其他硬碟/雲端。</p>
  <div class="row"><button class="b" onclick="expJSON()">匯出完整資料庫 (JSON)</button><label class="g" style="padding:5px 12px;border:1px solid var(--p);border-radius:6px;cursor:pointer;color:var(--p)">從 JSON 還原<input type="file" accept=".json" hidden onchange="impJSON(this.files[0])"></label><button class="g" onclick="expCSV()">匯出全部條目 CSV</button></div>
  <div class="mut">上次備份：${META.lastBackup?new Date(META.lastBackup).toLocaleString():'從未'}｜自上次備份異動 ${META.changes} 筆</div></div>
  <div class="card"><h2>自動分類規則</h2><p class="mut">每行「分類名:關鍵字1,關鍵字2」。</p><textarea id="rules" rows="9">${esc(META.rules)}</textarea><div class="row" style="margin-top:6px"><button class="b" onclick="saveRules()">儲存並重新套用到全部資料</button></div></div>
  <div class="card"><h2>危險操作</h2><button class="d" onclick="clearAll()">清空資料庫</button></div>`}
function expJSON(){const d=new Date(),p=n=>String(n).padStart(2,'0');dl(`查核資料庫備份_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`,JSON.stringify({schemaVersion:1,exported:d.toISOString(),meta:META,records:R}),'application/json');META.lastBackup=Date.now();META.changes=0;saveMeta();render()}
async function impJSON(f){if(!f)return;try{const j=JSON.parse(await f.text());if(j.schemaVersion!==1||!Array.isArray(j.records))throw Error('格式或版本不符');
  if(!confirm(`將匯入 ${j.records.length} 筆紀錄，相同 ID 會被覆蓋，繼續？`))return;for(const r of j.records)await put('records',r);R=await all('records');META={...META,...j.meta,lastBackup:Date.now(),changes:0};await saveMeta();render()}catch(e){alert('還原失敗：'+e.message)}}
function expCSV(){LAST=allItems();csvSearch()}
async function saveRules(){META.rules=$('#rules').value;R.forEach(r=>r.items.forEach(x=>x.cats=classify(x.text,x.type)));for(const r of R)await put('records',r);await saveMeta();alert('已重新套用')}
async function clearAll(){if(!confirm('這會刪除所有紀錄！請確認已備份。'))return;if(prompt('請輸入「清空」確認')!=='清空')return;for(const r of R)await del('records',r.id);R=[];render()}
/* ========== 啟動 ========== */
(async()=>{try{await openDB();R=await all('records');R.forEach(r=>r.items.forEach(x=>{if(x.type==='缺點'&&x.dp==null){const d=x.text.match(/[（(]\s*扣\s*(\d+(?:\.\d+)?)\s*點\s*[）)]\s*$/);x.dp=d?+d[1]:0;if(d)x.text=x.text.slice(0,d.index).trim()}}));const m=await get('meta','cfg');if(m)META={...META,...m};navigator.storage?.persist?.()}catch(e){alert('資料庫開啟失敗：'+e.message+'\n（請勿使用無痕模式）')}render()})();
</script></body></html>
